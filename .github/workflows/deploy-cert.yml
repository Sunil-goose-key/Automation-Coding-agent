name: Deploy to Cert

on:
  push:
    branches: [main]

# Required for GitHub OIDC -> AWS role assumption (no long-lived AWS keys stored in this repo).
permissions:
  id-token: write
  contents: read

env:
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::513001132747:role/cert-deploy-github-actions
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: automation-coding-agent-cert
  ECS_CLUSTER: CertCluster
  ECS_SERVICE: CertService

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DEBUG - decode OIDC token claims
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | node -pe 'JSON.stringify(JSON.parse(require("fs").readFileSync(0,"utf8")), null, 2)' || echo "decode failed"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy to Cert (force new ECS deployment)
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment
