name: Deploy to Cert

on:
  push:
    branches: [main]

# Required for GitHub OIDC -> AWS role assumption (no long-lived AWS keys stored in this repo).
permissions:
  id-token: write
  contents: read

env:
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::513001132747:role/cert-deploy-github-actions
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: automation-coding-agent-cert
  ECS_CLUSTER: CertCluster
  ECS_SERVICE: CertService
  CERT_URL: http://Automa-CertS-4zBWpyvurCt1-324493237.ap-south-1.elb.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy to Cert (force new ECS deployment)
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Wait for Cert service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run QA tests against Cert
        env:
          QA_TARGET_URL: ${{ env.CERT_URL }}
        run: npm run test:qa
