name: Deploy to Cert

on:
  push:
    branches: [main]

# Required for GitHub OIDC -> AWS role assumption (no long-lived AWS keys stored in this repo).
permissions:
  id-token: write
  contents: read

env:
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::513001132747:role/cert-deploy-github-actions
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: automation-coding-agent-cert
  ECS_CLUSTER: CertCluster
  ECS_SERVICE: CertService
  CERT_URL: http://Automa-CertS-4zBWpyvurCt1-324493237.ap-south-1.elb.amazonaws.com
  UAT_ECS_CLUSTER: UatCluster
  UAT_ECS_SERVICE: UatService
  UAT_IMAGE_TAG: uat-latest
  UAT_URL: http://Automa-UatSe-7kz444cp7VG3-1472525990.ap-south-1.elb.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy to Cert (force new ECS deployment)
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Wait for Cert service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run QA tests against Cert
        id: qa-cert
        env:
          QA_TARGET_URL: ${{ env.CERT_URL }}
        run: npm run test:qa

      - name: File Jira bug (Cert QA failure)
        if: failure() && steps.qa-cert.outcome == 'failure'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ENV_NAME: Cert
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -X POST -H "Content-Type: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue" -d "$(node -e '
              const body = {
                fields: {
                  project: { key: "SCRUM" },
                  issuetype: { name: "Bug" },
                  summary: `[${process.env.ENV_NAME} QA] Automated test failure on commit ${process.env.GITHUB_SHA.slice(0, 7)}`,
                  description: {
                    type: "doc", version: 1,
                    content: [{ type: "paragraph", content: [{ type: "text",
                      text: `QA tests failed against ${process.env.ENV_NAME} after deploying commit ${process.env.GITHUB_SHA}. Failed run: ${process.env.RUN_URL}` }] }],
                  },
                },
              };
              console.log(JSON.stringify(body));
            ')"

      - name: Promote image to UAT (retag within the same ECR repo)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'images[0].imageManifest' --output text)
          aws ecr put-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-tag "$UAT_IMAGE_TAG" \
            --image-manifest "$MANIFEST"

      - name: Deploy to UAT (force new ECS deployment)
        run: |
          aws ecs update-service \
            --cluster "$UAT_ECS_CLUSTER" \
            --service "$UAT_ECS_SERVICE" \
            --force-new-deployment

      - name: Wait for UAT service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$UAT_ECS_CLUSTER" \
            --services "$UAT_ECS_SERVICE"

      - name: Run QA tests against UAT
        id: qa-uat
        env:
          QA_TARGET_URL: ${{ env.UAT_URL }}
        run: npm run test:qa

      - name: File Jira bug (UAT QA failure)
        if: failure() && steps.qa-uat.outcome == 'failure'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ENV_NAME: UAT
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -X POST -H "Content-Type: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue" -d "$(node -e '
              const body = {
                fields: {
                  project: { key: "SCRUM" },
                  issuetype: { name: "Bug" },
                  summary: `[${process.env.ENV_NAME} QA] Automated test failure on commit ${process.env.GITHUB_SHA.slice(0, 7)}`,
                  description: {
                    type: "doc", version: 1,
                    content: [{ type: "paragraph", content: [{ type: "text",
                      text: `QA tests failed against ${process.env.ENV_NAME} after deploying commit ${process.env.GITHUB_SHA}. Failed run: ${process.env.RUN_URL}` }] }],
                  },
                },
              };
              console.log(JSON.stringify(body));
            ')"
